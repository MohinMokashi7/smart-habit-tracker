spring.application.name=api-gateway

server.port=8080

# -------------------------
# Eureka
# -------------------------
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# -------------------------
# User Service Route
# -------------------------
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

# -------------------------
# Habit Service Route
# -------------------------
spring.cloud.gateway.server.webflux.routes[1].id=habit-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://HABIT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/habits/**

# -------------------------
# Habit Analytics Route
# -------------------------
spring.cloud.gateway.server.webflux.routes[2].id=habit-service-analytics
spring.cloud.gateway.server.webflux.routes[2].uri=lb://HABIT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/analytics/**